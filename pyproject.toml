[project]
name = "jev-system-one-model-primitives"
version = "0.1.0"
description = "Jev System One primitives (Noul, Score, Choice) demoed with a FastAPI backend and a React + TypeScript UI."
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk",
    "fastapi",
    "uvicorn[standard]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit list: auto-discovery fails once node_modules/ and web/ sit next to the .py files.
py-modules = ["app", "chaos", "cult", "sandwich"]
