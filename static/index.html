<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>Jev · Lab</div>
    <nav class="tabs" id="tabs">
      <span class="slider"></span>
      <button data-tab="sandwich">Sandwich<small>NOUL</small></button>
      <button data-tab="cult">Cult<small>SCORE</small></button>
      <button data-tab="chaos">Chaos<small>CHOICE</small></button>
    </nav>
  </header>
  <main id="view"></main>
  <footer>
    <span>Jev answers. Code decides.</span>
    <span><a href="https://docs.typesafe.ai/introduction" target="_blank" rel="noopener">docs.typesafe.ai</a></span>
  </footer>
</div>
<script src="/static/sandwich.js"></script>
<script src="/static/cult.js"></script>
<script src="/static/chaos.js"></script>
<script>
  const tabs = document.querySelectorAll("#tabs button"), slider = document.querySelector("#tabs .slider");
  function show() {
    const name = location.hash.slice(1) in window.views ? location.hash.slice(1) : "sandwich";
    tabs.forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
    const on = document.querySelector("#tabs button.on");
    slider.style.left = on.offsetLeft + "px"; slider.style.width = on.offsetWidth + "px";
    const view = document.getElementById("view");
    view.innerHTML = '<div class="page"></div>';
    window.views[name].mount(view.firstChild);
  }
  tabs.forEach((b) => (b.onclick = () => (location.hash = b.dataset.tab)));
  addEventListener("hashchange", show);
  document.fonts.ready.then(show); show();
</script>
</body>
</html>
